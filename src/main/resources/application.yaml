spring:
  application:
    name: eventpass
  profiles:
    default: dev
  flyway:
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 50
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 20
        jdbc:
          time_zone: UTC

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:PT1H}
  booking:
    max-tickets-per-event: ${APP_BOOKING_MAX_TICKETS_PER_EVENT:6}
    cancel-cutoff-hours: ${APP_BOOKING_CANCEL_CUTOFF_HOURS:24}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}


server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never